# Netlify build settings (ADR-0005). The Netlify project is linked to this repository: it builds and
# publishes main on every merge (production) and builds a deploy preview for every pull request. This
# repository's CI never deploys, and nobody deploys by hand.
[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build when the change touches nothing the site is built from (documents, tests, CI, hooks,
  # the changelog). Exit 0 stops the build and exit 1 lets it run; anything unexpected (no previous
  # build to compare with, a git error) builds. "An exit code of 1 indicates the contents have changed
  # and the build process continues as usual. An exit code of 0 indicates that there are no changes and
  # the build should stop." https://docs.netlify.com/build/configure-builds/ignore-builds/ (accessed 2026-10-01).
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify scripts astro.config.mjs tsconfig.json package.json package-lock.json netlify.toml .nvmrc && exit 0 || exit 1"

[build.environment]
  NODE_VERSION = "22"
  # No git hooks on the build machine (husky's documented switch).
  HUSKY = "0"

# The read-only MCP server (ADR-0004, ADR-0005): netlify/functions/mcp.mts at /api/mcp, bundled with
# esbuild together with the data module. Its route and its rate limit (30 requests per 60 s per IP) are in
# the function's `config`: Netlify does not read function rate limits from this file. Custom [[headers]]
# do not apply to function responses either, so the function sets its own (cache-control: no-store,
# x-content-type-options: nosniff); no CORS headers, since the page calls it from the same origin.
# https://docs.netlify.com/manage/security/secure-access-to-sites/rate-limiting/ and
# https://docs.netlify.com/manage/routing/headers/ (accessed 2026-09-30).
[functions]
  node_bundler = "esbuild"
  # The npm count written by the build (ADR-0003); without it the function falls back to the snapshot.
  included_files = ["src/data/generated/npm.json"]

# The web app manifest's media type: Netlify serves .webmanifest as application/octet-stream by default.
# scripts/check-dist.ts fails the build when this block is missing or names another type.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The site's fonts (Astro's Fonts API, /_astro/fonts/) for the lab's perfectui-live preview: a sandboxed iframe
# (src/scripts/playground.ts) has an opaque origin, and fonts always load through CORS, so without this header the
# preview falls back to system fonts. The files are public and hold nothing else; no credentials are allowed.
# scripts/check-dist.ts fails the build when this block is missing or names another value.
[[headers]]
  for = "/_astro/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Old routes of the previous site (ADR-0010). /projects exists again, so only /carrer is redirected.
[[redirects]]
  from = "/carrer"
  to = "/"
  status = 301
