# Version updates for what the project ships and for the pinned actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the Node major the site runs on (.nvmrc: 22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check 0.9.10 accepts TypeScript ^5 or ^6 only; lift this when it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
