# The project's checks and a secret scan, on every push to main and every pull request (ADR-0009).
# The same checks run in the pre-commit hook (.githooks/pre-commit), except `lighthouse`, which needs Chrome
# and about a minute (run it locally with `npm run lighthouse` after a build), and the layout sweep
# (`npm run check:layout`, a browser and about 30 s) and the playground check (`npm run check:playground`). Actions are pinned to a commit
# (a tag can be moved); Dependabot proposes updates. Read-only permissions.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan reads every commit
          persist-credentials: false
      - name: Secrets in the working tree
        run: python3 scripts/secret-scan/secret_scan.py
      - name: Secrets in history
        run: python3 scripts/secret-scan/secret_scan.py --history

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (npm count, sensitive-topics check of data and dist, astro build)
        run: npm run build
        env:
          # Optional repository secret, one term per line (ADR-0002). Empty on forks: the check says so.
          SENSITIVE_PRIVATE_TERMS: ${{ secrets.SENSITIVE_PRIVATE_TERMS }}
      # Every page at 15 widths (320 to 1920 px) with scrollbars drawn: no horizontal scroll. Uses the Google
      # Chrome preinstalled on the runner image, so no browser download.
      - name: Layout (no horizontal scroll from 320 to 1920 px)
        run: npm run check:layout -- --channel chrome --jobs 4
      # The lab's perfectui-live playground: lazy chunk, editor, sandboxed preview, Reset, script isolation.
      - name: Playground (editor and sandboxed preview)
        run: npm run check:playground -- --channel chrome

  # Lighthouse 13.5.0 (pinned in package.json) on the built site served locally, mobile profile: one warm-up
  # run per page, discarded (a fresh runner's first run on / scored 55 to 95 while the next ones scored 98 to
  # 99), then the median of 5 runs per page: performance >= 90 and agentic-browsing = 100 on / and /pt/
  # (ADR-0009, AC-7 gate, AC-8). The summary lists each run's benchmarkIndex. Uses the Google Chrome
  # preinstalled on the runner image.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          SENSITIVE_PRIVATE_TERMS: ${{ secrets.SENSITIVE_PRIVATE_TERMS }}
      - name: Lighthouse (performance >= 90 mobile, agentic-browsing = 100)
        run: npm run lighthouse -- --warmup 1 --runs 5
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore
